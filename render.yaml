# Render Blueprint — provisions backend + worker + Redis together.
# Import via: Render dashboard → New → Blueprint → select this repo.
# The frontend is NOT here — it's deployed separately on Vercel (frontend/vercel.json).
#
# After the first apply, you'll be prompted to fill in ANTHROPIC_API_KEY
# (marked `sync: false` below — Render never stores secrets in this file).
#
# Free plan note: free web/worker services on Render spin down after ~15
# minutes of inactivity and take 30-60s to cold-start on the next request.
# Fine for development; upgrade `backend` (and ideally `worker`) to at
# least the Starter plan before a live/judged demo, or the "verdict in
# under a minute" experience will be blown by the cold start alone.

services:
  - type: web
    name: dekisugi-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: REDIS_URL
        fromService:
          type: redis
          name: dekisugi-redis
          property: connectionString
      - key: SESSION_TTL_SECONDS
        value: 300
      - key: RESULT_TTL_SECONDS
        value: 120
      - key: RESULT_WAIT_TIMEOUT_MS
        value: 25000
      - key: MAX_UPLOAD_BYTES
        value: 8388608
      - key: CORS_ORIGIN
        value: "*" # tighten to your actual Vercel URL once you have it

  # Redis job consumer — pulls from fraud:jobs, calls Claude, publishes the
  # result back. Not web-facing; see /CONTRACT.md and
  # backend-api/app/redis_worker.py.
  - type: worker
    name: dekisugi-worker
    runtime: docker
    dockerfilePath: ./backend-api/Dockerfile
    dockerContext: ./backend-api
    dockerCommand: python -m app.redis_worker
    region: singapore
    plan: free
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: dekisugi-redis
          property: connectionString
      - key: RESULT_TTL_SECONDS
        value: 120
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: CLAUDE_TIMEOUT_SECONDS
        value: 25

  - type: redis
    name: dekisugi-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # private network only — not reachable from the public internet
